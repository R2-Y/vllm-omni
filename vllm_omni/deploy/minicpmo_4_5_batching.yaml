# MiniCPM-o 4.5 opt-in batching deploy: 2-GPU layout.
#
# Stage 0 and the Stage-1 Talker AR backbone use vLLM continuous batching.
# Token2Wav remains in-process in Stage 1 and emits request-scoped PCM chunks.
pipeline: minicpmo_4_5
async_chunk: false

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.7
    enforce_eager: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    limit_mm_per_prompt:
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "1"
    limit_mm_per_prompt:
      image: 0
      video: 0
      audio: 0
    additional_config:
      minicpmo_talker_mode: continuous
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_tokens: 50
      max_tokens: 2048
      stop_token_ids: [1]
      seed: 42
      detokenize: false

platforms: {}
